name: Android build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate translations
        run: python3 tools/check_translations.py
      - name: Audit hard-coded UI strings
        run: python3 tools/audit_hardcoded_strings.py
      - name: Build and lint debug APK
        run: ./gradlew --no-daemon lintDebug assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: OSPy-mobile-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
