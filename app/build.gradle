plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
}

def signingPropertiesFile = new File(
        System.getProperty("user.home"),
        "android-keys/ospy-mobile-signing.properties"
)
def signingProperties = new Properties()
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def releaseSigningAvailable = ["storeFile", "storePassword", "keyAlias", "keyPassword"].every {
    signingProperties.getProperty(it)
}

android {
    namespace "com.pihrt.ospy.mobile"
    compileSdk 37

    defaultConfig {
        applicationId "com.pihrt.ospy.mobile"
        minSdk 26
        targetSdk 37
        versionCode 26
        versionName "0.3.19"
    }

    signingConfigs {
        release {
            if (releaseSigningAvailable) {
                storeFile file(signingProperties.getProperty("storeFile"))
                storePassword signingProperties.getProperty("storePassword")
                keyAlias signingProperties.getProperty("keyAlias")
                keyPassword signingProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
            if (releaseSigningAvailable) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:34.16.0")
    implementation "com.google.firebase:firebase-messaging"
    releaseImplementation "com.google.firebase:firebase-appcheck-playintegrity"
    debugImplementation "com.google.firebase:firebase-appcheck-debug"
}
