plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
}

def signingPropertiesOverride = System.getenv("OSPY_MOBILE_SIGNING_PROPERTIES")
def signingPropertiesFile = signingPropertiesOverride
        ? file(signingPropertiesOverride)
        : new File(
                System.getProperty("user.home"),
                "android-keys/ospy-mobile-signing.properties"
        )
def signingProperties = new Properties()
def signingStoreFile = null
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
    def configuredStoreFile = signingProperties.getProperty("storeFile")
    if (configuredStoreFile) {
        signingStoreFile = file(configuredStoreFile)
        if (!signingStoreFile.isFile()) {
            signingStoreFile = new File(
                    signingPropertiesFile.parentFile,
                    new File(configuredStoreFile).name
            )
        }
    }
}
def releaseSigningAvailable = ["storeFile", "storePassword", "keyAlias", "keyPassword"].every {
    signingProperties.getProperty(it)
} && signingStoreFile != null && signingStoreFile.isFile()

def releaseDate = "2026-10-31"

android {
    namespace "com.pihrt.ospy.mobile"
    compileSdk 37

    defaultConfig {
        applicationId "com.pihrt.ospy.mobile"
        minSdk 26
        targetSdk 37
        versionCode 45
        versionName "0.3.37"
        buildConfigField "String", "VERSION_DATE", "\"${releaseDate}\""
    }

    signingConfigs {
        release {
            if (releaseSigningAvailable) {
                storeFile signingStoreFile
                storePassword signingProperties.getProperty("storePassword")
                keyAlias signingProperties.getProperty("keyAlias")
                keyPassword signingProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            optimization {
                enable = true
            }
            if (releaseSigningAvailable) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // Google Play services declares very old minimum AndroidX versions.
    // Pin current releases so the generated bundle does not inherit them.
    implementation "androidx.activity:activity:1.13.0"
    implementation "androidx.fragment:fragment:1.9.0"
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "com.github.bumptech.glide:glide:5.0.9"
    implementation platform("com.google.firebase:firebase-bom:34.18.0")
    implementation "com.google.firebase:firebase-analytics"
    implementation "com.google.firebase:firebase-messaging"
    releaseImplementation "com.google.firebase:firebase-appcheck-playintegrity"
    debugImplementation "com.google.firebase:firebase-appcheck-debug"
    testImplementation "junit:junit:4.13.2"
}
