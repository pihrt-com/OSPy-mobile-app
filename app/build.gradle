plugins {
    id "com.android.application"
}

android {
    namespace "com.pihrt.ospy.mobile"
    compileSdk 35

    defaultConfig {
        applicationId "com.pihrt.ospy.mobile"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

