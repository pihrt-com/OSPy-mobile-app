plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
}

def signingPropertiesFile = new File(
        System.getProperty("user.home"),
        "android-keys/ospy-mobile-signing.properties"
)
def signingProperties = new Properties()
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def releaseSigningAvailable = ["storeFile", "storePassword", "keyAlias", "keyPassword"].every {
    signingProperties.getProperty(it)
}

android {
    namespace "com.pihrt.ospy.mobile"
    compileSdk 37

    defaultConfig {
        applicationId "com.pihrt.ospy.mobile"
        minSdk 26
        targetSdk 37
        versionCode 38
        versionName "0.3.31"
    }

    signingConfigs {
        release {
            if (releaseSigningAvailable) {
                storeFile file(signingProperties.getProperty("storeFile"))
                storePassword signingProperties.getProperty("storePassword")
                keyAlias signingProperties.getProperty("keyAlias")
                keyPassword signingProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            optimization {
                enable = true
            }
            if (releaseSigningAvailable) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // Google Play services declares very old minimum AndroidX versions.
    // Pin current releases so the generated bundle does not inherit them.
    implementation "androidx.activity:activity:1.13.0"
    implementation "androidx.fragment:fragment:1.9.0"
    implementation "com.github.bumptech.glide:glide:5.0.9"
    implementation platform("com.google.firebase:firebase-bom:34.17.0")
    implementation "com.google.firebase:firebase-analytics"
    implementation "com.google.firebase:firebase-messaging"
    releaseImplementation "com.google.firebase:firebase-appcheck-playintegrity"
    debugImplementation "com.google.firebase:firebase-appcheck-debug"
    testImplementation "junit:junit:4.13.2"
}
